# Prometheus 配置文件 — CreditLife 智能客服系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'creditlife'
    environment: 'production'

rule_files: []

scrape_configs:
  # CreditLife 主应用指标
  - job_name: 'creditlife-app'
    static_configs:
      - targets: ['creditlife:8000']
        labels:
          service: 'creditlife'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
